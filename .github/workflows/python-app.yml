name: Python Oyun Motoru CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Sözdizimi (Syntax) Kontrolü
      run: |
        python -m py_compile oyunmotorumkod2.py
